<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Agentic Motor Claims</title>
    <script>
      // Resolve the theme before first paint so there is never a light→dark flash.
      (function () {
        try {
          var pref = localStorage.getItem("amc-theme") || "system";
          var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          var collapsed = localStorage.getItem("amc-sidebar-collapsed") === "1";
          if (collapsed) document.documentElement.setAttribute("data-sidebar", "collapsed");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
